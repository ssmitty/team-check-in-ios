# ci.yml
# Purpose: Compile the simulator app and run portable core behavior tests.
name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core behavior tests
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server pairing tests
        run: node --test backend/pairing.test.mjs
      - name: Simulator app build
        run: xcodebuild -project TeamCheckIn.xcodeproj -scheme TeamCheckIn -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.20.3
      - name: Start isolated local backend
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api > /tmp/backend-start.log 2>&1
      - name: Check database access contract
        run: supabase test db
      - name: Start pairing worker
        run: |
          supabase functions serve generate-pairings > /tmp/pairing-worker.log 2>&1 &
          for attempt in $(seq 1 120); do
            if grep -q 'Serving functions' /tmp/pairing-worker.log; then exit 0; fi
            sleep 1
          done
          printf "::error::Pairing worker did not become ready within 120 seconds.\n"
          exit 1
      - name: Exercise accounts and private persistence
        run: node --test backend/integration.test.mjs
